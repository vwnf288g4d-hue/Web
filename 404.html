<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — No Discipline Art</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    .wrap { position: relative; z-index: 1; }
    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: .75rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(6rem, 28vw, 16rem);
      font-weight: 700;
      line-height: .85;
      letter-spacing: -.04em;
      -webkit-text-stroke: 2px #f0f0f0;
      color: transparent;
      margin-bottom: 1.5rem;
    }
    p {
      font-family: 'Space Mono', monospace;
      font-size: .85rem;
      letter-spacing: .12em;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }
    a.home {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .85rem 2rem;
      border: 1.5px solid #c9a84c;
      color: #c9a84c;
      font-family: 'Space Mono', monospace;
      font-size: .8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background .25s, color .25s, transform .2s;
    }
    a.home:hover { background: #c9a84c; color: #000; transform: translateY(-2px); }
    .glow {
      position: fixed;
      top: 50%; left: 50%;
      width: 60vmax; height: 60vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(201,168,76,.08) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <p class="eyebrow">No Discipline Art · Košice</p>
    <h1>404</h1>
    <p>This piece doesn't exist — yet.</p>
    <a class="home" href="/">Back to the studio</a>
  </div>
</body>
</html>
