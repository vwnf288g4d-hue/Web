name: Deploy to GitHub Pages

# Builds the static site (plain HTML/CSS/JS + images) and publishes it to
# GitHub Pages. The custom domain (www.nodisciplineart.sk) is taken from the
# CNAME file at the repo root.

on:
  push:
    branches:
      - main
      - claude/no-discipline-art-website-No10k
  workflow_dispatch:

# Permissions required by the Pages deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on a new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository root is the site (no build step needed)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
